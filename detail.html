<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายละเอียดเมนู - อร่อยไทยวันนี้</title>
<style>
  :root {
    --color-deep-forest: #00473c;
    --color-lime-glow: #e6ff55;
    --color-sage-mist: #d8e5d6;
    --color-warm-sand: #e8dcc6;
    --color-cream-canvas: #f4f3e7;
    --color-forest-shadow: #0e150e;
    --color-warm-gray: #8c8c82;
    --color-slate-gray: #555555;

    --font-display: 'SweetSans', ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
    --font-text: 'SweetSansText', ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;

    --spacing-8: 8px; --spacing-12: 12px; --spacing-16: 16px;
    --spacing-20: 20px; --spacing-24: 24px; --spacing-40: 40px;

    --radius-badges: 20px; --radius-images: 20px; --radius-buttons: 9999px;
    --shadow-xl: rgba(14, 21, 14, 0.4) 3px 3px 32px -10px;
    --page-max-width: 720px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-text);
    background: var(--color-cream-canvas);
    color: var(--color-forest-shadow);
    min-height: 100vh;
  }

  main {
    max-width: var(--page-max-width);
    margin: 0 auto;
    padding: var(--spacing-24) var(--spacing-20) var(--spacing-40);
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-8);
    color: var(--color-forest-shadow);
    text-decoration: none;
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 16px;
    margin: var(--spacing-16) 0 var(--spacing-24);
  }

  .back-link:hover { text-decoration: underline; }

  .detail-media {
    aspect-ratio: 4 / 3;
    border-radius: var(--radius-images);
    background: var(--color-warm-sand);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: var(--spacing-24);
  }

  .detail-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .detail-media .emoji-fallback {
    font-size: 120px;
  }

  .detail-category {
    display: inline-block;
    background: var(--color-lime-glow);
    color: var(--color-forest-shadow);
    border-radius: var(--radius-badges);
    padding: 4px 12px;
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: var(--spacing-16);
  }

  .detail-name {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(32px, 6vw, 48px);
    line-height: 1;
    margin: 0 0 var(--spacing-16);
    color: var(--color-forest-shadow);
  }

  .detail-desc {
    font-family: var(--font-text);
    font-weight: 400;
    font-size: 18px;
    line-height: 1.33;
    letter-spacing: 0.54px;
    color: var(--color-slate-gray);
    margin: 0 0 var(--spacing-40);
  }

  .detail-ingredients-title {
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 18px;
    color: var(--color-forest-shadow);
    margin: 0 0 var(--spacing-16);
  }

  .detail-ingredients {
    margin: 0 0 var(--spacing-40);
    padding-left: var(--spacing-20);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--spacing-8) var(--spacing-16);
    font-family: var(--font-text);
    font-weight: 400;
    font-size: 16px;
    color: var(--color-forest-shadow);
  }

  .fav-toggle-btn {
    width: 100%;
    border: none;
    border-radius: var(--radius-buttons);
    padding: 16px 24px;
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.017em;
    cursor: pointer;
    background: var(--color-lime-glow);
    color: var(--color-forest-shadow);
    box-shadow: var(--shadow-xl);
    transition: transform 0.15s ease;
  }

  .fav-toggle-btn:active { transform: translateY(1px); }

  .fav-toggle-btn.active {
    background: var(--color-deep-forest);
    color: var(--color-cream-canvas);
  }

  .not-found {
    text-align: center;
    padding: 60px 20px;
    font-family: var(--font-text);
    color: var(--color-slate-gray);
  }
</style>
</head>
<body>

<main>
  <a class="back-link" href="index.html">← กลับหน้าหลัก</a>
  <div id="detail-content"></div>
</main>

<script src="dishes.js"></script>
<script>
(function () {
  const FAVORITES_KEY = "thaiFood.favorites";

  function findDish(id) {
    return DISHES.find(function (d) { return d.id === id; });
  }

  function loadFavorites() {
    try {
      const arr = JSON.parse(localStorage.getItem(FAVORITES_KEY));
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function saveFavorites(favs) {
    localStorage.setItem(FAVORITES_KEY, JSON.stringify(favs));
  }

  function getDishIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id") || "";
  }

  const dishId = getDishIdFromUrl();
  const dish = findDish(dishId);
  const content = document.getElementById("detail-content");

  if (!dish) {
    content.innerHTML = '<div class="not-found">ไม่พบเมนูที่ต้องการ</div>';
    return;
  }

  let favorites = loadFavorites();

  function isFav() {
    return favorites.indexOf(dish.id) !== -1;
  }

  const mediaHtml = dish.image
    ? '<img src="' + dish.image + '" alt="' + dish.name + '">'
    : '<span class="emoji-fallback">' + dish.emoji + '</span>';

  const ingredientsHtml = dish.ingredients
    .map(function (item) { return "<li>" + item + "</li>"; })
    .join("");

  content.innerHTML =
    '<div class="detail-media">' + mediaHtml + "</div>" +
    '<span class="detail-category">' + dish.category + "</span>" +
    '<h1 class="detail-name">' + dish.name + "</h1>" +
    '<p class="detail-desc">' + dish.desc + "</p>" +
    '<h2 class="detail-ingredients-title">ส่วนประกอบ</h2>' +
    '<ul class="detail-ingredients">' + ingredientsHtml + "</ul>" +
    '<button class="fav-toggle-btn" id="fav-toggle-btn"></button>';

  const favBtn = document.getElementById("fav-toggle-btn");

  function renderFavBtn() {
    const active = isFav();
    favBtn.textContent = active ? "❤️ ลบออกจากเมนูโปรด" : "🤍 เพิ่มเป็นเมนูโปรด";
    favBtn.className = "fav-toggle-btn" + (active ? " active" : "");
  }

  favBtn.addEventListener("click", function () {
    const idx = favorites.indexOf(dish.id);
    if (idx === -1) {
      favorites.push(dish.id);
    } else {
      favorites.splice(idx, 1);
    }
    saveFavorites(favorites);
    renderFavBtn();
  });

  renderFavBtn();
})();
</script>

</body>
</html>
