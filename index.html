<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อร่อยไทยวันนี้</title>
<style>
  :root {
    --color-deep-forest: #00473c;
    --color-lime-glow: #e6ff55;
    --color-sage-mist: #d8e5d6;
    --color-warm-sand: #e8dcc6;
    --color-cream-canvas: #f4f3e7;
    --color-forest-shadow: #0e150e;
    --color-pure-ink: #000000;
    --color-warm-gray: #8c8c82;
    --color-slate-gray: #555555;

    --font-display: 'SweetSans', ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
    --font-text: 'SweetSansText', ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;

    --spacing-4: 4px; --spacing-8: 8px; --spacing-12: 12px; --spacing-16: 16px;
    --spacing-20: 20px; --spacing-24: 24px; --spacing-40: 40px; --spacing-60: 60px;

    --radius-cards: 24px; --radius-small: 4px; --radius-badges: 20px;
    --radius-images: 20px; --radius-inputs: 8px; --radius-buttons: 9999px;

    --shadow-xl: rgba(14, 21, 14, 0.4) 3px 3px 32px -10px;
    --page-max-width: 1200px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-text);
    background: var(--color-cream-canvas);
    color: var(--color-forest-shadow);
    min-height: 100vh;
  }

  a { color: inherit; }

  .page-inner {
    max-width: var(--page-max-width);
    margin: 0 auto;
    padding: 0 var(--spacing-20);
  }

  /* Nav */
  .nav {
    background: var(--color-cream-canvas);
    padding: var(--spacing-24) 0;
  }

  .nav-inner {
    max-width: var(--page-max-width);
    margin: 0 auto;
    padding: 0 var(--spacing-20);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-16);
  }

  .logo {
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.017em;
    color: var(--color-deep-forest);
    text-decoration: none;
  }

  .nav-tagline {
    font-family: var(--font-text);
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.05em;
    color: var(--color-slate-gray);
    display: none;
  }

  @media (min-width: 640px) {
    .nav-tagline { display: block; }
  }

  /* Buttons */
  .btn-pill-fill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-buttons);
    background: var(--color-lime-glow);
    color: var(--color-forest-shadow);
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.017em;
    padding: 16px 24px;
    border: none;
    cursor: pointer;
    box-shadow: var(--shadow-xl);
    transition: transform 0.15s ease;
  }

  .btn-pill-fill:hover { transform: translateY(-2px); }
  .btn-pill-fill:active { transform: translateY(0); }

  .btn-pill-outline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-buttons);
    background: transparent;
    color: var(--color-deep-forest);
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 12px 20px;
    border: 2px solid var(--color-deep-forest);
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .btn-pill-outline:hover {
    background: var(--color-deep-forest);
    color: var(--color-cream-canvas);
  }

  .ghost-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    padding: 0;
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 16px;
    color: var(--color-forest-shadow);
    text-decoration: none;
    cursor: pointer;
  }

  .ghost-link:hover { text-decoration: underline; }

  /* Eyebrow */
  .eyebrow {
    text-transform: uppercase;
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.05em;
    color: var(--color-deep-forest);
    margin: 0 0 var(--spacing-16);
  }

  /* Hero */
  .hero {
    padding: var(--spacing-40) 0 var(--spacing-60);
  }

  .hero-inner {
    max-width: var(--page-max-width);
    margin: 0 auto;
    padding: 0 var(--spacing-20);
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--spacing-40);
    align-items: center;
    cursor: pointer;
  }

  @media (min-width: 860px) {
    .hero-inner { grid-template-columns: 1fr 1fr; }
  }

  .hero-name {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(36px, 6vw, 64px);
    line-height: 0.95;
    margin: 0 0 var(--spacing-16);
    color: var(--color-forest-shadow);
  }

  .hero-desc {
    font-family: var(--font-text);
    font-weight: 400;
    font-size: 18px;
    line-height: 1.33;
    letter-spacing: 0.54px;
    color: var(--color-slate-gray);
    max-width: 440px;
    margin: 0 0 var(--spacing-24);
  }

  .hero-media {
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-images);
    background: var(--color-sage-mist);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hero-media .emoji-fallback {
    font-size: 120px;
  }

  /* Sections */
  .section {
    padding: var(--spacing-60) 0;
  }

  .section.band {
    background: var(--color-sage-mist);
  }

  .section-heading {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(28px, 4vw, 48px);
    line-height: 1;
    margin: 0 0 var(--spacing-24);
    color: var(--color-forest-shadow);
  }

  /* Favorites */
  .favorites-list {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-12);
    margin-bottom: var(--spacing-8);
  }

  .fav-chip {
    display: flex;
    align-items: center;
    gap: var(--spacing-8);
    background: transparent;
    border: 2px solid var(--color-deep-forest);
    border-radius: var(--radius-buttons);
    padding: 10px 18px;
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 14px;
    color: var(--color-deep-forest);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .fav-chip:hover {
    background: var(--color-deep-forest);
    color: var(--color-cream-canvas);
  }

  .fav-chip .remove {
    font-weight: 700;
    opacity: 0.7;
  }

  .empty-msg {
    font-family: var(--font-text);
    font-size: 16px;
    color: var(--color-slate-gray);
    margin: var(--spacing-8) 0 0;
  }

  /* Filter bar */
  .filter-bar {
    margin-bottom: var(--spacing-40);
  }

  .search-input {
    width: 100%;
    max-width: 420px;
    display: block;
    padding: 12px 16px;
    border: 2px solid var(--color-warm-gray);
    border-radius: var(--radius-inputs);
    font-size: 16px;
    font-family: var(--font-text);
    color: var(--color-forest-shadow);
    background: var(--color-cream-canvas);
    margin-bottom: var(--spacing-24);
  }

  .search-input:focus {
    outline: none;
    border-color: var(--color-deep-forest);
  }

  .category-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-24) var(--spacing-40);
  }

  .tab-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(18px, 2.6vw, 28px);
    color: var(--color-forest-shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-8);
  }

  .tab-btn::after {
    content: "";
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--color-deep-forest);
    opacity: 0;
  }

  .tab-btn.active::after {
    opacity: 1;
  }

  /* Gallery / product cards */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: var(--spacing-40) var(--spacing-24);
  }

  .dish-card {
    cursor: pointer;
  }

  .card-media {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-images);
    overflow: hidden;
    background: var(--color-warm-sand);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-media .emoji-fallback {
    font-size: 64px;
  }

  .today-badge {
    position: absolute;
    top: var(--spacing-12);
    left: var(--spacing-12);
    background: var(--color-lime-glow);
    color: var(--color-forest-shadow);
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 12px;
    border-radius: var(--radius-badges);
  }

  .fav-btn {
    position: absolute;
    top: var(--spacing-12);
    right: var(--spacing-12);
    background: var(--color-cream-canvas);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    filter: grayscale(1);
    opacity: 0.6;
    transition: opacity 0.15s ease, filter 0.15s ease, transform 0.15s ease;
  }

  .fav-btn.active {
    filter: none;
    opacity: 1;
  }

  .fav-btn:active { transform: scale(1.15); }

  .card-name {
    font-family: var(--font-text);
    font-weight: 700;
    font-size: 20px;
    color: var(--color-forest-shadow);
    margin: var(--spacing-24) 0 var(--spacing-8);
  }

  .card-desc {
    font-family: var(--font-text);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.25;
    color: var(--color-slate-gray);
    margin: 0 0 var(--spacing-16);
    min-height: 40px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: var(--spacing-40) var(--spacing-20);
    font-family: var(--font-text);
    font-size: 14px;
    color: var(--color-slate-gray);
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html">อร่อยไทยวันนี้</a>
    <span class="nav-tagline">สุ่มเมนูอาหารไทยประจำวัน</span>
    <a class="btn-pill-outline" href="#menu">เมนูทั้งหมด</a>
  </div>
</header>

<main>
  <section class="hero" id="spotlight">
    <div class="hero-inner">
      <div class="hero-text">
        <div class="eyebrow">เมนูวันนี้</div>
        <h1 class="hero-name" id="spotlight-name"></h1>
        <p class="hero-desc" id="spotlight-desc"></p>
        <button class="btn-pill-fill" id="reroll-btn">สุ่มเมนูใหม่</button>
      </div>
      <div class="hero-media" id="spotlight-emoji"></div>
    </div>
  </section>

  <section class="section" id="favorites">
    <div class="page-inner">
      <div class="eyebrow">ที่บันทึกไว้</div>
      <h2 class="section-heading">เมนูโปรดของฉัน</h2>
      <div class="favorites-list" id="favorites-list"></div>
      <p class="empty-msg" id="favorites-empty">ยังไม่มีเมนูโปรด ลองกดหัวใจที่เมนูที่ชอบดูสิ!</p>
    </div>
  </section>

  <section class="section band" id="menu">
    <div class="page-inner">
      <div class="eyebrow">สำรวจเมนู</div>
      <h2 class="section-heading">เมนูอาหารไทยทั้งหมด</h2>
      <div class="filter-bar">
        <input type="text" class="search-input" id="search-input" placeholder="ค้นหาเมนู เช่น ผัดไทย หรือ pad thai...">
        <div class="category-tabs" id="category-chips"></div>
      </div>
      <div class="gallery" id="gallery"></div>
      <p class="empty-msg" id="gallery-empty" style="display:none;">ไม่พบเมนูที่ตรงกับคำค้นหาหรือหมวดหมู่ที่เลือก</p>
    </div>
  </section>
</main>

<footer class="footer">ทำด้วยความหิว 🍚</footer>

<script src="dishes.js"></script>
<script>
(function () {
  const DISH_OF_DAY_KEY = "thaiFood.dishOfDay";
  const FAVORITES_KEY = "thaiFood.favorites";

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function findDish(id) {
    return DISHES.find(function (d) { return d.id === id; });
  }

  function randomDishId(excludeId) {
    const pool = excludeId ? DISHES.filter(function (d) { return d.id !== excludeId; }) : DISHES;
    const source = pool.length ? pool : DISHES;
    return source[Math.floor(Math.random() * source.length)].id;
  }

  function loadDishOfDay() {
    let stored = null;
    try {
      stored = JSON.parse(localStorage.getItem(DISH_OF_DAY_KEY));
    } catch (e) {}

    if (stored && stored.date === todayStr() && findDish(stored.dishId)) {
      return stored.dishId;
    }

    const dishId = randomDishId(stored ? stored.dishId : null);
    saveDishOfDay(dishId);
    return dishId;
  }

  function saveDishOfDay(dishId) {
    localStorage.setItem(DISH_OF_DAY_KEY, JSON.stringify({ date: todayStr(), dishId: dishId }));
  }

  function loadFavorites() {
    try {
      const arr = JSON.parse(localStorage.getItem(FAVORITES_KEY));
      return Array.isArray(arr) ? arr.filter(function (id) { return !!findDish(id); }) : [];
    } catch (e) {
      return [];
    }
  }

  function saveFavorites(favs) {
    localStorage.setItem(FAVORITES_KEY, JSON.stringify(favs));
  }

  let dishOfDayId = loadDishOfDay();
  let favorites = loadFavorites();
  saveFavorites(favorites);

  let searchQuery = "";
  let activeCategory = "ทั้งหมด";

  function matchesFilter(dish) {
    if (activeCategory !== "ทั้งหมด" && dish.category !== activeCategory) return false;
    const q = searchQuery.trim().toLowerCase();
    if (!q) return true;
    const haystack = (dish.name + " " + dish.desc + " " + dish.id.replace(/-/g, " ")).toLowerCase();
    return haystack.indexOf(q) !== -1;
  }

  function toggleFavorite(dishId) {
    const idx = favorites.indexOf(dishId);
    if (idx === -1) {
      favorites.push(dishId);
    } else {
      favorites.splice(idx, 1);
    }
    saveFavorites(favorites);
    render();
  }

  function reroll() {
    dishOfDayId = randomDishId(dishOfDayId);
    saveDishOfDay(dishOfDayId);
    render();
  }

  function renderSpotlight() {
    const dish = findDish(dishOfDayId);
    const mediaEl = document.getElementById("spotlight-emoji");
    mediaEl.innerHTML = dish.image
      ? '<img src="' + dish.image + '" alt="' + dish.name + '">'
      : '<span class="emoji-fallback">' + dish.emoji + '</span>';
    document.getElementById("spotlight-name").textContent = dish.name;
    document.getElementById("spotlight-desc").textContent = dish.desc;
  }

  function renderGallery() {
    const gallery = document.getElementById("gallery");
    const emptyMsg = document.getElementById("gallery-empty");
    gallery.innerHTML = "";

    const visibleDishes = DISHES.filter(matchesFilter);

    emptyMsg.style.display = visibleDishes.length === 0 ? "block" : "none";

    visibleDishes.forEach(function (dish) {
      const isToday = dish.id === dishOfDayId;
      const isFav = favorites.indexOf(dish.id) !== -1;

      const card = document.createElement("div");
      card.className = "dish-card";
      card.dataset.id = dish.id;

      const mediaHtml = dish.image
        ? '<img src="' + dish.image + '" alt="' + dish.name + '">'
        : '<span class="emoji-fallback">' + dish.emoji + '</span>';

      card.innerHTML =
        '<div class="card-media">' +
          (isToday ? '<span class="today-badge">เมนูวันนี้</span>' : "") +
          '<button class="fav-btn' + (isFav ? " active" : "") + '" data-id="' + dish.id + '" aria-label="ถูกใจ">❤️</button>' +
          mediaHtml +
        "</div>" +
        '<div class="card-name">' + dish.name + "</div>" +
        '<div class="card-desc">' + dish.desc + "</div>" +
        '<span class="ghost-link">ดูเพิ่มเติม →</span>';

      gallery.appendChild(card);
    });
  }

  function renderCategoryChips() {
    const container = document.getElementById("category-chips");
    container.innerHTML = "";
    CATEGORIES.forEach(function (cat) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab-btn" + (cat === activeCategory ? " active" : "");
      btn.dataset.category = cat;
      btn.textContent = cat;
      container.appendChild(btn);
    });
  }

  function renderFavorites() {
    const list = document.getElementById("favorites-list");
    const emptyMsg = document.getElementById("favorites-empty");
    list.innerHTML = "";

    if (favorites.length === 0) {
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";

    favorites.forEach(function (dishId) {
      const dish = findDish(dishId);
      if (!dish) return;
      const chip = document.createElement("div");
      chip.className = "fav-chip";
      chip.dataset.id = dish.id;
      chip.innerHTML = "<span>" + dish.emoji + " " + dish.name + "</span><span class=\"remove\">✕</span>";
      list.appendChild(chip);
    });
  }

  function render() {
    renderSpotlight();
    renderGallery();
    renderFavorites();
  }

  document.getElementById("reroll-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    reroll();
  });

  document.getElementById("spotlight").addEventListener("click", function () {
    window.location.href = "detail.html?id=" + encodeURIComponent(dishOfDayId);
  });

  document.getElementById("gallery").addEventListener("click", function (e) {
    const btn = e.target.closest(".fav-btn");
    if (btn) {
      toggleFavorite(btn.dataset.id);
      return;
    }
    const card = e.target.closest(".dish-card");
    if (card) window.location.href = "detail.html?id=" + encodeURIComponent(card.dataset.id);
  });

  document.getElementById("favorites-list").addEventListener("click", function (e) {
    const chip = e.target.closest(".fav-chip");
    if (!chip) return;
    if (e.target.closest(".remove")) {
      toggleFavorite(chip.dataset.id);
      return;
    }
    window.location.href = "detail.html?id=" + encodeURIComponent(chip.dataset.id);
  });

  document.getElementById("search-input").addEventListener("input", function (e) {
    searchQuery = e.target.value;
    renderGallery();
  });

  document.getElementById("category-chips").addEventListener("click", function (e) {
    const btn = e.target.closest(".tab-btn");
    if (!btn) return;
    activeCategory = btn.dataset.category;
    renderCategoryChips();
    renderGallery();
  });

  renderCategoryChips();
  render();
})();
</script>

</body>
</html>
